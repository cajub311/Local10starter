name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or update the local10-android-debug GitHub Release"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "*.pdf"
      - "*.png"
      - "union-one/**"
      - "android/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-debug-apk.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build standalone debug APK
    runs-on: ubuntu-latest

    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: "1.0.${{ github.run_number }}"

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build APK
        run: npm run android:debug

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Local10-Hub-debug-apk
          path: dist/android/Local10-Hub-debug.apk
          if-no-files-found: error

      - name: Publish/update GitHub Release
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="local10-android-debug"
          APK="dist/android/Local10-Hub-debug.apk"
          NOTES="Standalone Android debug APK for Local 10 Hub.

          Download the APK on Android, tap it, and allow install from the browser if prompted.

          App ID: com.cajub311.local10hub
          Version code: $VERSION_CODE
          Built from commit: $GITHUB_SHA"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Local 10 Hub Android Debug APK" --notes "$NOTES"
          fi
