<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local 10 Union Contract</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            union: {
              red: '#c41e3a',
              'red-dark': '#9a1830',
              navy: '#0f172a',
              'navy-light': '#1e293b',
            }
          },
          fontFamily: {
            'display': ['Oswald', 'sans-serif'],
            'sans': ['Work Sans', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Work Sans', system-ui, sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
  </style>
</head>
<body class="bg-union-navy text-white min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-6">

    <!-- Compact top section -->
    <div class="text-center py-6 px-4">
      <h1 class="font-display text-2xl sm:text-3xl font-bold text-white mb-4">
        Local 10 Union Contract
      </h1>
      <div class="flex justify-center mb-2">
        <div id="qrcode" class="w-[220px] h-[220px] sm:w-[260px] sm:h-[260px] p-2 bg-white rounded-lg border border-union-red inline-flex items-center justify-center overflow-hidden"></div>
      </div>
      <p class="text-sm text-slate-300">
        Scan with your phone → opens Full Contract PDF
      </p>
    </div>

    <!-- Search hint + PDF viewer (the star) -->
    <div class="mb-4">
      <p class="text-sm sm:text-base text-slate-300 mb-3">
        🔍 Tap the 🔎 inside the PDF to search: pay, sick time, overtime, vacation, seniority, benefits, etc.
      </p>
      <iframe 
        id="pdfViewer" 
        src="" 
        style="width:100%; height:68vh; min-height:460px; border:none; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.2);" 
        allowfullscreen
        title="Union Contract PDF Viewer"
      ></iframe>
    </div>

    <!-- Buttons below PDF (stacked on phones) -->
    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4">
      <a id="downloadBtn" href="contract.pdf" download="union-contract.pdf" class="flex-1 px-6 py-4 rounded-xl bg-union-red hover:bg-union-red-dark text-white font-display font-bold text-lg uppercase tracking-wide text-center shadow-lg transition-all">
        Download PDF
      </a>
      <a id="newTabBtn" href="contract.pdf" target="_blank" rel="noopener" class="flex-1 px-6 py-4 rounded-xl bg-union-red hover:bg-union-red-dark text-white font-display font-bold text-lg uppercase tracking-wide text-center shadow-lg transition-all">
        Open PDF in New Tab
      </a>
      <button id="copyBtn" onclick="copyPdfLink()" class="flex-1 px-6 py-4 rounded-xl bg-slate-600 hover:bg-slate-500 text-white font-display font-bold text-lg uppercase tracking-wide shadow-lg transition-all">
        Copy Direct PDF Link
      </button>
    </div>
  </div>

  <script>
    function getPdfUrl() {
      return new URL('contract.pdf', window.location.href).href;
    }

    document.addEventListener('DOMContentLoaded', function() {
      const pdfUrl = getPdfUrl();
      
      // PDF viewer - Mozilla PDF.js with built-in search
      const viewerUrl = 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(pdfUrl) + '#zoom=page-width';
      document.getElementById('pdfViewer').src = viewerUrl;
      
      document.getElementById('downloadBtn').href = pdfUrl;
      document.getElementById('newTabBtn').href = pdfUrl;
      
      // QR code: 220px on phones, 260px on larger screens — always links to live contract.pdf
      const qrSize = window.matchMedia('(min-width: 640px)').matches ? 260 : 220;
      new QRCode(document.getElementById('qrcode'), {
        text: pdfUrl,
        width: qrSize,
        height: qrSize
      });
    });

    function copyPdfLink() {
      const url = getPdfUrl();
      navigator.clipboard.writeText(url).then(function() {
        const btn = document.getElementById('copyBtn');
        const orig = btn.textContent;
        btn.textContent = 'Copied!';
        btn.classList.add('bg-green-600');
        setTimeout(function() {
          btn.textContent = orig;
          btn.classList.remove('bg-green-600');
        }, 2000);
      });
    }
  </script>
</body>
</html>
