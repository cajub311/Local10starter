<!DOCTYPE html>
<html lang="en">
<head>
  <title>QR Codes - Union Steward Hub</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1428">
  <link rel="stylesheet" href="_shared.css">
  <script src="_shared.js"></script>
  <style>
    body { margin: 0; min-height: 100vh; }
    main { max-width: 860px; margin: 0 auto; padding: 1rem; }
    h1 { color: var(--text-strong); font-size: clamp(2rem, 8vw, 3.2rem); line-height: 0.95; margin: 1rem 0 0.35rem; }
    .qr-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .qr-card { text-align: center; }
    .qr-box { display: inline-flex; padding: 0.75rem; background: #fff; border-radius: 0.35rem; box-shadow: 0 2px 0 rgba(0,0,0,.45); }
    .qr-box img, #site-qrcode img { display: block; width: 220px; height: auto; }
    #site-url-text { margin-top: 0.8rem; color: var(--text-dim); font-size: 0.78rem; word-break: break-all; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <main>
    <a href="index.html" class="btn-outline" style="font-size:0.8rem;padding:0.35rem 0.75rem;min-height:auto;">Back Home</a>
    <h1>QR Codes For Sharing</h1>
    <p style="color:#cbd5e1;max-width:62ch;line-height:1.45;">Use the app QR for coworkers with Android phones. Use the website QR for flyers, posters, or anyone who just needs the web version.</p>

    <div class="qr-grid">
      <section class="card qr-card">
        <span class="tag tag-gold">Android app</span>
        <h2 style="color:#fff;font-size:1.25rem;margin:0.6rem 0 0.35rem;">Download APK</h2>
        <div class="qr-box"><img src="app-download-qr.svg" alt="QR code to download the Local 10 Hub Android app"></div>
        <div style="display:flex;gap:0.45rem;justify-content:center;flex-wrap:wrap;margin-top:0.85rem;">
          <a class="btn-red" href="https://github.com/cajub311/Local10starter/releases/download/local10-android-debug/Local10-Hub-debug.apk">Download</a>
          <button class="btn-outline" type="button" onclick="shareAppDownload()">Share</button>
        </div>
      </section>

      <section class="card qr-card">
        <span class="tag tag-blue">Website</span>
        <h2 style="color:#fff;font-size:1.25rem;margin:0.6rem 0 0.35rem;">Open Web Hub</h2>
        <div class="qr-box" id="site-qrcode" aria-label="QR code to Union Steward Hub website"></div>
        <div id="site-url-text"></div>
        <button class="btn-outline" style="margin-top:0.85rem;" type="button" onclick="copySiteUrl()">Copy Site URL</button>
      </section>
    </div>
  </main>

  <script>
    (function(){
      var path = (window.location.pathname || '/').replace(/\/qr\.html.*$/, '').replace(/\/?$/, '/');
      var url = window.location.origin + path + 'index.html';
      var qrEl = document.getElementById('site-qrcode');
      if (qrEl && typeof QRCode !== 'undefined') {
        qrEl.innerHTML = '';
        new QRCode(qrEl, { text: url, width: 220, height: 220 });
      }
      var urlEl = document.getElementById('site-url-text');
      if (urlEl) urlEl.textContent = url;
      window.siteUrl = url;
    })();
    function copySiteUrl() {
      copyText(window.siteUrl || window.location.origin + '/index.html', 'Site URL');
    }
  </script>
</body>
</html>
