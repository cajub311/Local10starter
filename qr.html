<!DOCTYPE html>
<html lang="en">
<head>
  <title>QR Code — Union Steward Hub (Unofficial)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a1428">
  <style>
    body { background: #0a1428; color: #f1f5f9; font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem; }
    #qrcode { padding: 1rem; background: white; border-radius: 8px; display: inline-block; }
    #url-text { margin-top: 1rem; padding: 0.5rem 1rem; background: #0f1f3d; border: 1px solid #1e3a5f; border-radius: 6px; color: #94a3b8; font-size: 0.85rem; word-break: break-all; max-width: 100%; }
    .btn { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.25rem; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
    .btn:hover { background: #b91c1c; }
    a { color: #60a5fa; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <h1>Union Steward Hub — QR Code (Unofficial)</h1>
  <p>Scan or print for flyers, posters, locker room</p>
  <div id="qrcode" aria-label="QR code to Union Steward Hub"></div>
  <div id="url-text"></div>
  <button class="btn" onclick="copyUrl()">🔗 Copy URL</button>
  <p style="margin-top:2rem;"><a href="index.html">← Back to Contract</a></p>
  <script>
    (function(){
      var path = (window.location.pathname || '/').replace(/\/qr\.html.*$/, '').replace(/\/?$/, '/');
      var url = window.location.origin + path + 'index.html';
      var qrEl = document.getElementById('qrcode');
      if (qrEl && typeof QRCode !== 'undefined') {
        qrEl.innerHTML = '';
        new QRCode(qrEl, { text: url, width: 256, height: 256 });
      }
      var urlEl = document.getElementById('url-text');
      if (urlEl) urlEl.textContent = url;
      window.siteUrl = url;
    })();
    function copyUrl() {
      navigator.clipboard.writeText(window.siteUrl || window.location.origin + '/index.html').then(function() {
        var btn = document.querySelector('.btn');
        if (btn) { btn.textContent = '✅ Copied!'; setTimeout(function(){ btn.textContent = '🔗 Copy URL'; }, 2000); }
      });
    }
  </script>
</body>
</html>
